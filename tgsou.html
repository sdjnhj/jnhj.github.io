/* emby 式首页多行 */

.home-filter { padding: 10px 0 4px; }

.hf-chip { flex: 0 0 auto; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--ink-dim); -webkit-tap-highlight-color: transparent; }
.hf-chip.active { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }

.hf-toggle { display: inline-flex; align-items: center; gap: 4px; margin: 0 16px 8px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--panel-soft); border: 1px solid var(--line); color: var(--ink-dim); -webkit-tap-highlight-color: transparent; }
.hf-toggle:active { transform: scale(.96); }

.mh-back { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: var(--ink); -webkit-tap-highlight-color: transparent; }

.section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 0 var(--gut); }
.section-title { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }

.poster { position: relative; width: 100%; max-width: 100%; aspect-ratio: 2 / 3; padding-top: 0; flex: none; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border: 1px solid var(--line); box-shadow: 0 4px 12px rgba(8,24,64,.38); }
.no-aspect-ratio .poster { aspect-ratio: auto; padding-top: 150%; height: 0; }
.poster img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.poster .noimg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 26px; font-weight: 800; text-align: center; padding: 8px; }
.card { transition: transform .12s ease; cursor: pointer; position: relative; width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box; overflow: hidden; }
.card:active { transform: scale(.97); }
.card, .card * { -webkit-user-select: none; -moz-user-select: none; user-select: none; -webkit-touch-callout: none; }
.card img { -webkit-user-drag: none; user-drag: none; }
.card-title { margin-top: 8px; font-size: 14px; font-weight: 700; letter-spacing: -.2px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { font-size: 11px; color: var(--ink-faint); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { position: absolute; top: 7px; left: 7px; padding: 2px 7px; border-radius: 6px; background: var(--badge-bg); border: 1px solid var(--badge-border); color: var(--accent-ink); font-size: 9.5px; font-weight: 800; letter-spacing: .02em; box-shadow: 0 2px 8px var(--badge-shadow); }

.empty { text-align: center; color: var(--ink-faint); font-size: 14px; padding: 40px 20px; }
.loading-row { padding: 26px 16px; text-align: center; color: var(--ink-faint); font-size: 13px; }

/* 详情 / 资源浮层 —— 满幅海报英雄区（参考 HBO/Emby） */
.sheet { position: fixed; top: 0; right: 0; bottom: 0; left: 0; inset: 0; z-index: 60; display: none; background: transparent; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
.sheet.active { display: block; }
body.detail-active .app { visibility: hidden; pointer-events: none; }
body.detail-active { background: var(--ed-bg, var(--sheet-bg)); transition: background-color 1.1s ease; }

.ed-hero { position: fixed; inset: 0; z-index: -2; overflow: hidden; background: var(--ed-bg, #070b1a); }
.ed-hero-imgs { position: absolute; inset: 0; }
.ed-hero-imgs img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 18%;
  transform: scale(1.06); opacity: 0; transition: opacity 1.1s ease, filter .2s linear; image-rendering: high-quality; }
.ed-hero-imgs img.active { opacity: 1; }
.ed-hero-imgs img.active.first-in { animation: heroIn 1.1s cubic-bezier(.2,.7,.2,1) forwards, heroBreathe 11s ease-in-out 1.1s infinite; }
.ed-hero-imgs img.active:not(.first-in) { animation: heroBreathe 11s ease-in-out infinite; }
@keyframes heroIn { from { transform: scale(1.14); opacity: 0; } to { transform: scale(1.06); opacity: 1; } }
@keyframes heroBreathe { 0%, 100% { transform: scale(1.06); } 50% { transform: scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .ed-hero-imgs img.active, .ed-hero-imgs img.active.first-in { animation: none; } }
.ed-hero-shade { position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(to bottom, rgba(0,0,0,.32) 0%, rgba(0,0,0,.08) 18%, transparent 30%); }
.ed-hero-blend {
  position: absolute; left: 0; right: 0; bottom: 0; height: 72%; z-index: 1; pointer-events: none;
  -webkit-backdrop-filter: blur(36px) saturate(1.12);
  backdrop-filter: blur(36px) saturate(1.12);
  background: linear-gradient(to bottom,
    rgba(var(--ed-bg-rgb, 6,5,10), 0) 0%,
    rgba(var(--ed-bg-rgb, 6,5,10), .22) 20%,
    rgba(var(--ed-bg-rgb, 6,5,10), .55) 38%,
    rgba(var(--ed-bg-rgb, 6,5,10), .86) 55%,
    rgba(var(--ed-bg-rgb, 6,5,10), 1) 68%,
    rgba(var(--ed-bg-rgb, 6,5,10), 1) 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.3) 18%, #000 42%);
  mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.3) 18%, #000 42%);
}
.ed-hero-spacer { width: 100%; height: 62vh; min-height: 380px; }
@media (orientation: landscape) { .ed-hero-spacer { height: 75vh; min-height: 320px; } }
@media (orientation: landscape) { .ed-hero-blend { height: 55%; } }

.ed-back { position: fixed; top: calc(var(--safe-top) + 8px); left: 14px; z-index: 3;
  width: 40px; height: 40px; border-radius: 50%; font-size: 24px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  background: rgba(7,11,26,.5); color: #fff; border: 1px solid rgba(160,190,255,.22);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }

.ed-body { position: relative; z-index: 2; margin-top: -60px; padding: 0 18px calc(var(--safe-bottom) + 26px);
  display: flex; flex-direction: column; align-items: center; text-align: center; }
.ed-title { font-size: 30px; font-weight: 900; line-height: 1.14; letter-spacing: -.02em; margin-bottom: 13px; text-shadow: 0 2px 20px rgba(0,0,0,.75); }

.ed-chips { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; margin-bottom: 2px; }
.ed-chips .t { display: inline-flex; align-items: center; margin: 0 0 6px; padding: 0; border: 0; background: none;
  font-size: 12.5px; font-weight: 600; letter-spacing: .03em; color: var(--ink-dim); }

.ed-desc { margin: 12px 2px 2px; font-size: 14px; color: var(--ink-dim); line-height: 1.7; text-align: left; align-self: stretch; position: relative; }
.ed-desc:empty { display: none; }
.ed-desc.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }

/* 演员表 */
.ed-cast { align-self: stretch; margin: 16px 0 0; }
.ed-cast:empty { display: none; }
.ed-cast-head { font-size: 15px; font-weight: 700; margin: 0 0 9px; }
.ed-cast-row { display: flex; align-items: flex-start; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 4px 3px; margin: 0 -3px; }
.ed-cast-row::-webkit-scrollbar { display: none; }
.cast-cell { flex: 0 0 auto; width: 150px; margin-right: 14px; display: flex; align-items: center; gap: 9px; text-align: left; }
.cast-av { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%; overflow: hidden; background: var(--panel-soft); border: 1px solid var(--line); position: relative; }
.cast-av img { width: 100%; height: 100%; object-fit: cover; display: block; }

.cast-info { min-width: 0; flex: 1 1 auto; }
.cast-name { font-size: 12.5px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cast-role { margin-top: 2px; font-size: 11px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 网盘资源 tabs + 列表 */
.ed-qtabs { display: flex; flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; margin: 0 0 0 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.ed-qtabs::-webkit-scrollbar { display: none; }
.ed-qtab { flex: 0 0 auto; white-space: nowrap; margin: 0 6px 0 0; padding: 4px 11px; border-radius: 8px; font-size: 12px; font-weight: 600;
  background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--ink-dim); }
.ed-qtab.active { background: var(--grad); color: var(--accent-ink); border-color: transparent; }

.pan-head { display: flex; align-items: center; align-self: stretch; margin: 14px 0 8px; }
.pan-head .title { font-size: 15px; font-weight: 700; flex: 0 0 auto; }
.pan-head .sub { margin-left: 8px; font-size: 11px; color: var(--ink-faint); }
.pan-list { align-self: stretch; min-height: 40px; max-height: 480px; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px 8px 8px; background: rgba(255,255,255,.02); }
.pan-list::-webkit-scrollbar { width: 4px; }
.pan-list::-webkit-scrollbar-track { background: transparent; }
.pan-list::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }
.pan-item { display: flex; align-items: center; padding: 11px 12px; margin-bottom: 8px; background: rgba(var(--panel-rgb), .13); border: 1px solid var(--line); border-radius: 10px; }
.pan-item:last-child { margin-bottom: 0; }
.pan-dot { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; margin-right: 10px; background: var(--gray); }
.pan-dot.ok { background: var(--ok); } .pan-dot.bad { background: var(--bad); }
.pan-dot.uncertain { background: var(--warn); }
.pan-dot.fail { background: var(--bad); }
.pan-dot.idle { background: var(--gray); }
.pan-dot.checking { background: var(--accent); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:.45} 50%{opacity:.9} }
.pan-type { flex: 0 0 auto; min-width: 46px; text-align: center; padding: 4px 10px; border-radius: 999px; margin-right: 10px; font-size: 11px; font-weight: 800;
  background: rgba(var(--panel-rgb), .18); border: 1px solid var(--line-strong); color: var(--accent); }
.pan-body { flex: 1 1 auto; min-width: 0; }
.pan-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.pan-sub { font-size: 11px; color: var(--ink-faint); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pan-play { flex: 0 0 auto; margin-left: 10px; padding: 7px 14px; border-radius: 8px; background: var(--grad); color: var(--accent-ink); font-weight: 700; font-size: 12px; background-size: 220% 220%; animation: gradFlow 8s ease-in-out infinite; }
.pan-play:active { transform: scale(.95); }
.pan-empty, .pan-loading { padding: 22px 14px; text-align: center; color: var(--ink-faint); font-size: 13px; }

/* 搜索联想下拉 */
.search-box { position: relative; }
.search-suggest { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 40; max-height: 60vh; overflow-y: auto;
  background: var(--panel-strong); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 18px 44px rgba(0,0,0,.5);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); display: none; }
.search-suggest.show { display: block; }
.search-suggest:empty { display: none; }
.sug-item { display: flex; align-items: center; padding: 3px 6px; border-radius: 7px; gap: 6px; }
.sug-item:active { background: var(--accent-soft); }
.sug-pos { flex: 0 0 auto; width: 22px; height: 32px; border-radius: 4px; overflow: hidden; background: var(--panel-soft); display: grid; place-items: center; }
.sug-pos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sug-pos .ph { font-size: 11px; opacity: .5; }
.sug-body { min-width: 0; flex: 1 1 auto; line-height: 1.25; }
.sug-title { font-size: 11.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.sug-meta { font-size: 10px; color: var(--ink-faint); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 5px; line-height: 1.2; }
.sug-type { padding: 0 5px; border-radius: 999px; background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent); font-weight: 700; font-size: 9px; }
.sug-year { font-weight: 600; }
.sug-empty { padding: 6px 8px; font-size: 11px; color: var(--ink-faint); }

/* 按钮 */
.btn { padding: 11px 24px; border-radius: 11px; font-size: 14px; font-weight: 700; background: var(--panel-soft); border: 1px solid var(--line); color: var(--ink); text-align: center; }
.btn.primary { background: var(--grad); border-color: transparent; color: var(--accent-ink); box-shadow: 0 4px 16px var(--btn-shadow); background-size: 220% 220%; animation: gradFlow 8s ease-in-out infinite; }
.btn:active { transform: scale(.985); }
.btn.danger-small { background: var(--bad, #ff5c66); border-color: transparent; color: #fff; font-size: 13px; padding: 9px 16px; }

/* 设置 —— 居中独立弹出卡片 */
.panel-overlay { position: fixed; top: 0; right: 0; bottom: 0; left: 0; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; padding: 24px calc(16px + var(--safe-right)) calc(16px + var(--safe-bottom)) calc(16px + var(--safe-left)); background: rgba(8,11,15,.6); }
.panel-overlay.active { display: flex; }
.panel-sheet { position: relative; width: 100%; max-width: 460px; max-height: 100%; background: var(--panel-strong); border: 1px solid var(--line); border-radius: 18px; overflow-y: auto; padding: 18px 16px calc(var(--safe-bottom) + 14px); box-shadow: 0 24px 64px rgba(0,0,0,.5); }
.panel-close { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: var(--ink-dim); font-size: 16px; line-height: 1; background: rgba(255,255,255,.06); }
.panel-close:active { transform: scale(.88); }
.set-hd { display: flex; align-items: center; margin-bottom: 12px; padding-right: 30px; }
.set-hd h3 { margin: 0; font-size: 17px; }
.set-group { background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 13px; padding: 12px 12px 4px; margin-bottom: 10px; }
.set-group-title { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; }
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12px; color: var(--ink-dim); margin-bottom: 5px; }
.field label .hint { color: var(--ink-faint); font-size: 10.5px; font-weight: 400; }
.field input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 9px; background: rgba(0,0,0,.28); border: 1px solid var(--line); outline: none; color: var(--ink); font-size: 13px; }
.field input:focus { border-color: var(--accent); }
.field textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 9px; background: rgba(0,0,0,.28); border: 1px solid var(--line); outline: none; color: var(--ink); font-size: 13px; resize: none; font-family: inherit; }
.field textarea:focus { border-color: var(--accent); }
.panel-actions { display: flex; justify-content: center; margin-top: 16px; }
.panel-actions .btn { min-width: 116px; }
.panel-actions .btn + .btn { margin-left: 12px; }
.ch-list-box { max-height: 150px; overflow-y: auto; margin: 8px 0; border: 1px solid var(--line); border-radius: 9px; padding: 4px; }
.ch-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13px; }
.ch-row:last-child { border-bottom: 0; }
.ch-del { cursor: pointer; color: var(--bad); font-size: 14px; }

/* 底部胶囊导航 */
.chips { position: fixed; left: 50%; bottom: calc(10px + var(--safe-bottom)); transform: translateX(-50%);
  width: auto; max-width: 94%; display: inline-flex; align-items: center; gap: 2px; justify-content: center; z-index: 45;
  background: rgba(18, 26, 54, 0.62); -webkit-backdrop-filter: blur(24px) saturate(1.7); backdrop-filter: blur(24px) saturate(1.7);
  border: 1px solid rgba(160, 190, 255, 0.16); border-radius: 999px; padding: 5px 7px; overflow: visible;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.10);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.chip { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  padding: 7px 22px; border-radius: 999px; background: none; border: 0; color: var(--ink-dim); font-size: 10px; font-weight: 700; white-space: nowrap; transition: color .16s, background .16s;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.chip .chip-ico { width: 23px; height: 23px; display: block; }
.chip.active { background: var(--accent-soft); color: var(--accent); }
.chip:active { transform: scale(.94); }
main { padding-bottom: calc(var(--safe-bottom) + 16px); }
.chips::-webkit-scrollbar { display: none; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 96px); transform: translateX(-50%) translateY(10px); z-index: 90; max-width: 84%; padding: 10px 16px; border-radius: 999px; background: var(--panel-strong); border: 1px solid var(--line-strong); color: var(--ink); font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 动态流光：主色渐变缓慢流动 */
@keyframes gradFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
@media (prefers-reduced-motion: reduce) {
  .ed-qtab.active, .btn.primary, .pan-play, .search-go { animation: none; }
}

/* ============================================================
     美化增强层 v2 —— 叠加层，不覆盖原有功能逻辑
     原则：增强视觉层次 / 微动效 / 像素级精致，兼容旧 Webkit
     ============================================================ */

/* 全局滚动条精致化 */
*::-webkit-scrollbar { width: 3px; height: 3px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px; opacity: .6; }

/* —— 搜索框焦点态增强 —— */
.search-box { transition: border-color .22s ease, box-shadow .22s ease; }
.search-box:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft), 0 6px 20px rgba(0,0,0,.18); }
.search-go { transition: transform .15s ease, filter .15s ease; }
.search-go:active { transform: scale(.93); filter: brightness(1.1); }
.hdr-ico { transition: transform .15s ease, border-color .2s, color .2s, background .2s; }

/* —— 卡片光泽扫过 + 评分角标 —— */
.card { overflow: hidden; }
.poster { transition: box-shadow .3s ease, border-color .25s ease; }
.card:active .poster { box-shadow: 0 10px 28px rgba(8,24,64,.52), 0 0 0 1px var(--accent-line); border-color: var(--accent-line); }
.card .poster::after {
  content: ""; position: absolute; top: 0; left: -70%; width: 42%; height: 100%; z-index: 2; pointer-events: none;
  background: linear-gradient(110deg, transparent 0%, rgba(255,255,255,.08) 42%, rgba(255,255,255,.18) 50%, rgba(255,255,255,.08) 58%, transparent 100%);
  transform: skewX(-16deg); transition: left .55s cubic-bezier(.4,0,.2,1);
}
.card:active .poster::after { left: 130%; }

/* poster 加载渐入 + shimmer 骨架 */
.poster img { animation: pFadeIn .45s ease both; }
@keyframes pFadeIn { from { opacity: 0; } to { opacity: 1; } }
.poster.shimmer { background: linear-gradient(110deg, rgba(255,255,255,.04) 8%, rgba(255,255,255,.11) 20%, rgba(255,255,255,.04) 34%); background-size: 220% 100%; animation: pShimmer 1.5s ease-in-out infinite; }
@keyframes pShimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

/* 评分角标（SVG 星标，替代 emoji） */
.card-rate { position: absolute; top: 7px; right: 7px; z-index: 3; display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px 2px 5px;
  border-radius: 7px; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.14); color: #ffd25e; font-size: 10px; font-weight: 800; letter-spacing: .01em;
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.card-rate svg { width: 10px; height: 10px; fill: #ffd25e; flex: 0 0 auto; }

/* —— Hero 轮播增强 —— */
.hero-title, .hero-meta, .hero-ov { opacity: 0; animation: hTextIn .65s cubic-bezier(.2,.7,.2,1) both; }
.hero-title { animation-delay: .12s; }
.hero-meta { animation-delay: .22s; }
.hero-ov { animation-delay: .32s; }
@keyframes hTextIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.hero-dot { transition: width .3s cubic-bezier(.34,1.56,.64,1), background-color .25s ease, box-shadow .25s ease; }
.hero-dot.on { box-shadow: 0 0 10px rgba(255,255,255,.65), 0 1px 5px rgba(0,0,0,.4); }
.hero-shade { background: linear-gradient(to top, rgba(0,0,0,.5) 0%, rgba(0,0,0,.14) 28%, transparent 55%, rgba(0,0,0,.28) 100%), linear-gradient(to bottom, rgba(0,0,0,.5) 0%, transparent 30%); }
.hero-star { display: inline-flex; align-items: center; vertical-align: middle; line-height: 0; }
.hero-star svg { display: block; filter: drop-shadow(0 0 4px rgba(255,210,94,.5)); }

/* —— 筛选 chips 增强 —— */
.hf-chip { transition: transform .15s ease, background .18s ease, border-color .18s ease, color .18s ease, box-shadow .2s ease; }
.hf-chip.active { box-shadow: 0 0 0 1px var(--accent-line) inset, 0 4px 14px var(--accent-soft); }
.ch-chip { transition: transform .15s ease, background .18s ease, border-color .18s ease, color .18s ease, box-shadow .2s ease; }
.ch-chip.active { box-shadow: 0 0 0 1px var(--accent-line) inset; }
.ch-chip:active, .ch-add:active { transform: scale(.95); }
.hf-toggle { transition: transform .15s ease, background .18s ease, border-color .18s ease; }

/* —— 底部胶囊导航增强 —— */
.chip { transition: color .2s ease, background .2s ease, transform .15s ease, box-shadow .2s ease; }
.chip.active { box-shadow: 0 0 14px var(--accent-soft), 0 0 0 1px var(--accent-line) inset; }
.chip .chip-ico { transition: transform .22s cubic-bezier(.34,1.56,.64,1); }
.chip.active .chip-ico { transform: scale(1.1); }
.chips { box-shadow: 0 12px 32px rgba(0,0,0,.44), inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 1px rgba(160,190,255,.07); }

/* —— 详情页增强 —— */
.ed-back { transition: transform .15s ease, background .2s ease, border-color .2s ease; }
.ed-back:active { transform: scale(.9); background: rgba(7,11,26,.75); border-color: var(--accent-line); }
.ed-qtab { transition: transform .15s ease, background .18s ease, color .18s ease, border-color .18s ease; }
.ed-qtab:active { transform: scale(.95); }

/* pan-item 左侧色条 + 激活态 */
.pan-item { transition: border-color .22s ease, background .22s ease, transform .15s ease; position: relative; overflow: hidden; }
.pan-item:active { transform: scale(.992); border-color: var(--accent-line); background: rgba(var(--panel-rgb), .2); }
.pan-item::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 999px; background: var(--accent); opacity: 0; transition: opacity .22s ease; }
.pan-item:active::before { opacity: .8; }
.pan-play { transition: transform .15s ease, filter .15s ease; }
.pan-play:active { transform: scale(.95); filter: brightness(1.12); }

/* pan-dot 状态发光 */
.pan-dot { transition: background .22s ease, box-shadow .22s ease; }
.pan-dot.ok { box-shadow: 0 0 8px rgba(75,208,138,.55); }
.pan-dot.bad, .pan-dot.fail { box-shadow: 0 0 8px rgba(255,92,102,.4); }
.pan-dot.checking { box-shadow: 0 0 10px var(--accent); }

/* —— toast 增强 —— */
.toast { display: flex; align-items: center; gap: 8px; }
.toast::before { content: ""; flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }

/* —— 按钮增强 —— */
.btn { transition: transform .15s ease, box-shadow .2s ease, filter .15s ease; }
.btn:active { filter: brightness(1.06); transform: scale(.985); }
.btn.primary { box-shadow: 0 4px 18px var(--btn-shadow), inset 0 0 0 1px rgba(255,255,255,.08); }
.btn.danger-small { transition: transform .15s ease, filter .15s ease; }

/* —— 空状态 / 加载增强 —— */
.empty { padding: 54px 20px 42px; }
.empty::before { content: ""; display: block; width: 62px; height: 62px; margin: 0 auto 16px; border-radius: 50%;
  background: var(--panel-soft); border: 1px solid var(--line); box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 4px 14px rgba(0,0,0,.15); }
.loading-row { position: relative; }
.loading-row::after { content: ""; display: inline-block; width: 14px; height: 14px; margin-left: 8px; border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.pan-loading::after, .pan-empty::after { display: none; }

/* —— 标题左侧色条 —— */
.mh-section-title, .section-title { position: relative; padding-left: 13px; }
.mh-section-title::before, .section-title::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 4px; height: 72%; border-radius: 999px; background: var(--grad); box-shadow: 0 0 8px var(--accent-soft); }
.mh-more { transition: opacity .15s ease; }
.mh-more:active { opacity: .55; }

/* —— 设置面板增强 —— */
.panel-sheet { box-shadow: 0 28px 72px rgba(0,0,0,.56), 0 0 0 1px rgba(160,190,255,.06) inset; }
.panel-close { transition: transform .15s ease, background .2s ease; }
.panel-close:active { transform: scale(.86) rotate(90deg); }
.set-group { transition: border-color .2s ease; }
.field input, .field textarea { transition: border-color .2s ease, background .2s ease; }
.field input:focus, .field textarea:focus { box-shadow: 0 0 0 3px var(--accent-soft); }

/* —— 演员卡片增强 —— */
.cast-cell { transition: transform .15s ease; }
.cast-cell:active { transform: scale(.97); }
.cast-av { transition: border-color .2s ease, box-shadow .2s ease; }
.cast-av img { animation: pFadeIn .4s ease both; }

/* —— prefers-reduced-motion 降级 —— */
@media (prefers-reduced-motion: reduce) {
  .poster img, .poster.shimmer, .loading-row::after, .hero-title, .hero-meta, .hero-ov, .cast-av img { animation: none !important; }
  .card .poster::after { display: none; }
  .panel-close:active { transform: scale(.86); }
}

/* 评分角标 */
.card-rate { color: var(--accent); }

/* —— 自适应（原规则保留）—— */
/* 自适应 */
@media (min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); } }
@media (min-width: 1180px) { .grid { grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); } }
@supports (height: 100dvh) { .app { min-height: 100dvh; min-height: var(--fm-web-height, 100dvh); } }

/* ===== no-layout-gap fallback: 旧内核 flex gap 不生效时用 margin 代替 ===== */
html.no-layout-gap .ch-inline>*+*{margin-left:6px}
html.no-layout-gap .grid{gap:0}
html.no-layout-gap .grid>*+*{margin-left:var(--card-gut)}
html.no-layout-gap .grid>*+*{}
html.no-layout-gap .ed-qtabs>*+*{margin-left:6px}
html.no-layout-gap .ed-chips .t:not(:first-child){margin-left:6px}
html.no-layout-gap .pan-head>*+*{margin-left:8px}
html.no-layout-gap .chips>*+*{margin-left:2px}
</style>
</head>

function startHealthCheck(qt,pl,by,activeType){

    var items=(by[activeType]&&by[activeType].items)||[];

      var it=items[i];
      if(!PAN_CHECK_TYPES[it.type])continue;
      it._checked=false;it._checking=false;
      checkable.push(it);
    }
    if(!checkable.length)return;
    /* 新详情/切 tab → 旧 observer 作废 */
    _panCheckCtx={token:Date.now()};

          var idx=parseInt(en.target.getAttribute('data-pan-index'),10);
          var it=checkable[idx];
          if(!it||it._checked||it._checking)return;
          it._checking=true;
          due.push(it);
        });
        if(due.length)_runCheckBatches(qt,pl,by,due,ctx);

        var ri=parseInt(rows[r].getAttribute('data-pan-index'),10);
        var it=checkable[ri];
        if(it&&!it._checked&&!it._checking)_panObserver.observe(rows[r]);
      }
    }else{
      /* 旧内核兜底：直接检测当前可见列表 */
      var fallback=[];
      checkable.forEach(function(it){if(!it._checked&&!it._checking){it._checking=true;fallback.push(it)}});

function linkScore(title,kw){

      if(chars.length){
        var found=0;
        for(var i=0;i<chars.length;i++){if(chars[i]&&title.indexOf(chars[i])>=0)found++}

  if(/hdr|hdr10/i.test(title))score+=600;
  if(/臻彩|真彩/i.test(title))score+=550;
  if(/4k|2160p|uhd/i.test(tl))score+=500;
  if(/蓝光|bluray|blu-ray|remux/i.test(tl))score+=400;
  if(/1080p|fhd/i.test(tl))score+=300;
  if(/高码|高帧|60fps|120fps/i.test(title))score+=200;
  if(/720p|hd/i.test(tl))score+=100;

    var t2=document.createElement('div');t2.className='card-title';t2.textContent=it.title;card.appendChild(t2);
    var m=document.createElement('div');m.className='card-meta';m.textContent=it.meta||'';card.appendChild(m);
    card.onclick=(function(x){return function(){odHome(x)}})(it);
    frag.appendChild(card);
  }
  row.appendChild(frag);
}
function odHome(item){
  li=[item];
  od(0);
}
function odDirect(item){
  var dt2=$('#detailTitle'),tg=$('#detailTags'),dc=$('#detailDesc'),ca=$('#detailCast'),pl=$('#panList'),qt=$('#qTabs'),ps=$('#panSub'),sh=$('#sheet');
  var title=item.title||item.msgTitle||'';
  dt2.textContent=title;
  qt.dataset.title=title;
  tg.innerHTML='<span class="t">频道直接搜索</span><span class="t">'+esc(item.channel||'')+'</span>';
  dc.textContent=item.desc||'未在 TMDB 找到结果，已从频道直接搜索';
  dc.classList.remove('clamp');dc.classList.add('clamp');dc.style.display='';
  var dToggle=$('#detailDescToggle');dToggle.textContent='展开';dToggle.style.display='';
  dToggle.onclick=function(){if(dc.classList.contains('clamp')){dc.classList.remove('clamp');dToggle.textContent='收起'}else{dc.classList.add('clamp');dToggle.textContent='展开'}};
  ca.innerHTML='';
  li=[item];
  var by={};
  var item={url:item.url,label:item.label,type:item.type,msgTitle:item.msgTitle||item.title};
  if(!by[item.type])by[item.type]={label:item.label,items:[]};
  by[item.type].items.push(item);
  var types=Object.keys(by);
  var at=types[0];
  var tb=types.map(function(t){return'<button class="ed-qtab active" data-type="'+t+'">'+esc(by[t].label)+' '+by[t].items.length+'</button>'}).join('');
  qt.innerHTML=tb;
  var pn=document.createElement('div');pn.className='pan-item';pn.setAttribute('data-pan-index','0');pn.setAttribute('data-pan-url',item.url);
  pn.innerHTML='<span class="pan-dot idle"></span><span class="pan-type">'+esc(item.label)+'</span><div class="pan-body"><div class="pan-name">'+esc(item.msgTitle||item.title||item.label)+'</div><div class="pan-sub">'+esc(item.url)+'</div></div><button class="pan-play" data-url="'+esc(item.url)+'" data-type="'+esc(item.type)+'" data-title="'+esc(title)+'">打开</button>';
  pl.innerHTML='';pl.appendChild(pn);
  pl.querySelectorAll('.pan-play').forEach(function(b){b.onclick=function(){pr(b.dataset.url,b.dataset.type,b.dataset.title)}});
  startHealthCheck(qt,pl,by,at);
  sh.classList.add('active');document.body.classList.add('detail-active');
}
function renderHero(items){
  var box=$('#heroCarousel'),dots=$('#heroDots');
  if(!box||!items||!items.length){if(box)box.innerHTML='';if(dots)dots.innerHTML='';_heroState.items=[];return}
  _heroState.items=items;_heroState.index=0;
  var n=items.length;
  var track=document.createElement('div');track.className='hero-track';
  for(var i=0;i<n;i++){
    var it=items[i];
    var slide=document.createElement('div');slide.className='hero-slide';
    if(it.backdrop_path){
      var bg=document.createElement('img');bg.className='hero-bg';bg.src=TMDB_IMG_HERO+it.backdrop_path;bg.alt=it.title;bg.loading=i===0?'eager':'lazy';
      slide.appendChild(bg);
    }else if(it.poster){
      /* 无背景图时用海报做背景，object-position 上偏移 */
      var bg2=document.createElement('img');bg2.className='hero-bg';bg2.src=it.poster;bg2.alt=it.title;bg2.loading=i===0?'eager':'lazy';bg2.style.objectPosition='center 10%';
      slide.appendChild(bg2);
    }
    var shade=document.createElement('div');shade.className='hero-shade';slide.appendChild(shade);
    var blend=document.createElement('div');blend.className='hero-blend';slide.appendChild(blend);
    var info=document.createElement('div');info.className='hero-info';
    var title=document.createElement('div');title.className='hero-title';title.textContent=it.title;info.appendChild(title);
    var meta=document.createElement('div');meta.className='hero-meta';
    var metaText=it.meta||'';
    meta.textContent=metaText;
    if(it.vote_average){var rs=document.createElement('span');rs.className='hero-star';rs.innerHTML='<svg viewBox="0 0 24 24" width="13" height="13"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';meta.appendChild(rs);meta.appendChild(document.createTextNode(' '+it.vote_average.toFixed(1)))}
    info.appendChild(meta);
    if(it.overview){var ov=document.createElement('div');ov.className='hero-ov';ov.textContent=it.overview;info.appendChild(ov)}
    slide.appendChild(info);
    slide.onclick=(function(x){return function(){odHome(x)}})(it);
    track.appendChild(slide);
  }
  box.innerHTML='';box.appendChild(track);
  if(dots){dots.innerHTML='';for(var d=0;d<n;d++){var dot=document.createElement('span');dot.className='hero-dot'+(d===0?' on':'');dots.appendChild(dot)}}
  startHeroAuto();
}
function startHeroAuto(){
  if(_heroState.timer)clearTimeout(_heroState.timer);
  if(!_heroState.items||_heroState.items.length<2)return;
  _heroState.timer=setTimeout(function(){goHeroNext()},5200);
}
function goHeroNext(){
  var box=$('#heroCarousel');var n=_heroState.items.length;
  if(!box||!n)return;
  var track=box.querySelector('.hero-track');if(!track)return;
  _heroState.index=(_heroState.index+1)%n;
  track.style.transform='translateX(-'+(_heroState.index*100)+'%)';
  var dots=$('#heroDots');if(dots){var ds=dots.querySelectorAll('.hero-dot');for(var i=0;i<ds.length;i++)ds[i].classList.toggle('on',i===_heroState.index)}
  startHeroAuto();
}
var _hfState={type:'',genre:'',year:'',sort:'popularity.desc',country:'',pop:'',lang:''};
function hfChipClick(row,attr,val){
  var btns=row.querySelectorAll('.hf-chip');
  for(var i=0;i<btns.length;i++)btns[i].classList.toggle('active',btns[i].dataset[attr]===val);
  _hfState[attr]=val;
  loadDiscoverRows();
}
function bindHfGroup(rowId,attr){
  var row=$('#'+rowId);if(!row)return;
  var btns=row.querySelectorAll('.hf-chip');
  for(var i=0;i<btns.length;i++){(function(b){
    b.onclick=function(){hfChipClick(row,attr,b.dataset[attr])};
  })(btns[i]);}
}
bindHfGroup('hfType','type');
bindHfGroup('hfSort','sort');
bindHfGroup('hfGenre','genre');
bindHfGroup('hfYear','year');
bindHfGroup('hfCountry','country');
bindHfGroup('hfPop','pop');
bindHfGroup('hfLang','lang');
var hfToggleBtn=$('#hfToggle');
if(hfToggleBtn)hfToggleBtn.onclick=function(){
  var more=$('#hfMore');if(!more)return;
  var open=more.classList.toggle('open');
  hfToggleBtn.classList.toggle('open',open);
  var t=$('#hfToggleText');if(t)t.textContent=open?'收起筛选':'更多筛选';
};
function discoverRowTitle(){
  var typeMap={'':'全部','movie':'电影','tv':'电视剧','variety':'综艺','anime':'动漫'};
  var typeName=typeMap[_hfState.type]||'';
  var sortName=({ 'popularity.desc':'热门', 'recent':'最近更新', 'vote_average.desc':'评分高低' })[_hfState.sort]||'热门';
  var cnMap={ CN:'国产剧', 'HK|TW':'港台剧', 'US|GB|CA|AU':'欧美剧', JP:'日剧', KR:'韩剧', other:'其他剧' };
  var cnPart=_hfState.country?(cnMap[_hfState.country]||_hfState.country):'';
  var langMap={ 'zh|cn':'国语', en:'英语', cn:'粤语', ko:'韩语', ja:'日语', th:'泰语' };
  var langPart=_hfState.lang?(langMap[_hfState.lang]||_hfState.lang):'';
  var parts=[sortName];
  if(cnPart)parts.push(cnPart);
  if(typeName)parts.push(typeName);
  if(langPart)parts.push(langPart);
  return parts.join('·');
}
function loadDiscoverRows(){
  var box=$('#homeRows');if(!box)return;
  var existing=document.getElementById('hfDiscoverRow');
  if(existing)existing.remove();
  var s=makeHomeRow(discoverRowTitle(),'hf-grid-row');s.section.id='hfDiscoverRow';box.appendChild(s.section);
  tmdbDiscover(_hfState.type||'movie',_hfState.genre,_hfState.year,_hfState.sort,_hfState.country,_hfState.pop,'',_hfState.lang).then(function(items){fillHomeRow(s.row,items.slice(0,12))});
}
function loadHome(){
  var box=$('#homeRows');if(!box)return;
  box.innerHTML='';
  var history=getHistory();
  var histShell=null;
  if(history.length){
    histShell=makeHomeRow('最近观看',{onClear:function(){try{localStorage.removeItem('tgps_history')}catch(e){}loadHome()}});box.appendChild(histShell.section);
    fillHomeRow(histShell.row,history);
  }
  tmdbTrendingHome().then(function(trend){
    var s1=makeHomeRow('本周热播');box.appendChild(s1.section);
    fillHomeRow(s1.row,trend.slice(0,12));
  }).then(function(){loadDiscoverRows()}).catch(function(){loadDiscoverRows()});
}
function getHistory(){
  var list=[];try{var r=localStorage.getItem('tgps_history');if(r)list=JSON.parse(r)||[]}catch(e){}
  return list;
}
function saveHistory(list){try{localStorage.setItem('tgps_history',JSON.stringify(list))}catch(e){}}
function recordHistory(r){
  if(!r||(!r.id&&!r.title))return;
  var list=getHistory();
  var key=(r.media_type||'movie')+'|'+r.id+'|'+r.title;
  for(var i=0;i<list.length;i++){if(list[i]._k===key){list.splice(i,1);break}}
  list.unshift({
    _k:key,
    id:r.id,media_type:r.media_type,
    title:r.title||r.name||'',name:r.name||r.title||'',
    release_date:r.release_date||r.first_air_date||'',
    first_air_date:r.first_air_date||r.release_date||'',
    overview:r.overview||'',
    poster:r.poster||(r.poster_path?TMDB_IMG_POSTER_W+r.poster_path:''),
    poster_path:r.poster_path||'',
    backdrop_path:r.backdrop_path||'',
    genre_ids:r.genre_ids||[],
    popularity:r.popularity||0,
    vote_average:r.vote_average||0,
    year:(r.release_date||r.first_air_date||'').slice(0,4),
    typeName:r.typeName||(r.media_type==='tv'?'剧集':'电影'),
    meta:r.meta||(r.year?r.year+' · '+(r.typeName||(r.media_type==='tv'?'剧集':'电影')):''),
    ts:Date.now()
  });
  if(list.length>40)list=list.slice(0,40);
  saveHistory(list);
}

  $('#heroWrap').hidden=true;
  $('#homeRows').style.display='';
  $('#searchSection').style.display='none';
  $('#status').textContent='';
  var ci=$('#chInline');if(ci)ci.style.display='none';
}

  $('#heroWrap').hidden=true;
  $('#homeRows').style.display='none';
  $('#searchSection').style.display='';
  var ci=$('#chInline');if(ci)ci.style.display='none';
}
