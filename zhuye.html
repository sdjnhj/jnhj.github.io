<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>极简手机主页</title>
    <style>
        :root {
            --bg: #f0f0f5;
            --bg-image-light: none;
            --bg-image-dark: none;
            --bg-opacity: 1;
            --bg-color-light: #f0f0f5;
            --bg-color-dark: #000000;
            --card-bg: #ffffff;
            --icon-bg: #ececf0;
            --text: #1c1c1e;
            --text-sub: #8e8e93;
            --text-light: #aeaeb2;
            --divider: rgba(60, 60, 0.08);
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.04), 0 4px 20px rgba(0, 0, 0.02);
            --shadow-hover: 0 4px 16px rgba(0, 0, 0.06);
            --radius-card: 20px;
            --radius-icon: 14px;
            --radius-input: 26px;
            --bookmark-icon-bg: #ffffff;
            --search-height: 52px;
            --safe-area-top: max(20px, env(safe-area-inset-top, 0px));
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card-bg: #1c1c1e;
                --icon-bg: #2c2c2e;
                --text: #ffffff;
                --text-sub: #8e8e93;
                --text-light: #636366;
                --divider: rgba(84, 84, 88, 0.30);
                --shadow: 0 2px 10px rgba(0, 0, 0, 0.30);
                --shadow-hover: 0 4px 16px rgba(0, 0, 0.40);
                --bookmark-icon-bg: #2c2c2e;
            }
        }
        html.aira-dark {
            --bg: #000000;
            --card-bg: #1c1c1e;
            --icon-bg: #2c2c2e;
            --text: #ffffff;
            --text-sub: #8e8e93;
            --text-light: #636366;
            --divider: rgba(84, 84, 88, 0.30);
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.30);
            --shadow-hover: 0 4px 16px rgba(0, 0, 0.40);
            --bookmark-icon-bg: #2c2c2e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
        }
        body {
            font-family: -apple-system, "HarmonyOS Sans", "PingFang SC", system-ui, sans-serif;
            font-weight: 900;
            background-color: var(--bg);
            background-image: var(--bg-image-light);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--text);
            -webkit-user-select: none;
            user-select: none;
            overflow-x: hidden;
            padding-bottom: 80px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-color: var(--bg);
            opacity: var(--bg-opacity);
            z-index: -1;
            pointer-events: none;
        }
        .home-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
            position: relative;
        }
        .search-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }
        .search-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }
        .search-bar {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border-radius: var(--radius-input);
            box-shadow: none;
            padding: 0 8px 0 4px;
            height: var(--search-height);
            min-width: 0;
        }
        .search-bar .btn-icon {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: opacity 0.2s;
        }
        .search-bar .btn-icon:active {
            opacity: 0.5;
        }
        .search-bar .btn-icon svg {
            display: block;
            width: 26px;
            height: 26px;
            stroke: var(--text);
            stroke-width: 2.4;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        #searchInput {
            flex: 1;
            height: 100%;
            border: none;
            background: transparent;
            padding: 0 8px;
            font-size: 15px;
            font-weight: 900;
            color: var(--text);
            outline: none;
            min-width: 0;
        }
        #searchInput::placeholder {
            color: var(--text-light);
            font-weight: 700;
        }
        /* 合并单一功能按钮 */
        .combo-btn-wrap {
            flex-shrink: 0;
            width: var(--search-height);
            height: var(--search-height);
        }
        #comboMainBtn {
            type="button";
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 50%;
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: none;
            position: relative;
        }
        #comboMainBtn:active {
            opacity: 0.5;
            transform: scale(0.92);
        }
        .icon-tab, .icon-set {
            position: absolute;
            width: 24px;
            height: 24px;
            stroke: var(--text);
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: opacity 0.2s;
        }
        .icon-set {
            opacity: 0;
            pointer-events: none;
        }
        .mode-set .icon-tab { opacity: 0; }
        .mode-set .icon-set { opacity: 1; pointer-events: auto; }
        .home-section {
            margin-bottom: 0;
            background: transparent;
            border-radius: var(--radius-card);
            padding: 0;
            box-shadow: none;
        }
        .no-card {
            background: transparent !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            padding: 0 !important;
        }
        .section-header {
            display: none;
        }
        .section-body {
            overflow: hidden;
            position: relative;
        }
        @keyframes staggerIn {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.92);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        .section-body.expanding .bookmark-item {
            animation: staggerIn 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }
        .bookmarks {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px 6px;
            padding-bottom: 4px;
        }
        .bookmark-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 4px 0 2px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.40s cubic-bezier(0.34, 1, 0.64, 1);
            -webkit-touch-callout: none;
            position: relative;
        }
        .bookmark-item:active {
            transform: scale(0.86);
            transition: transform 0.10s ease-out;
        }
        .bookmark-item.drag-over {
            outline: 2px solid #3478f6;
        }
        .bookmark-icon {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-icon);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bookmark-icon-bg);
            color: var(--text-sub);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            transition: box-shadow 0.25s, transform 0.25s;
            flex-shrink: 0;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
        .bookmark-icon img {
            border-radius: calc(var(--radius-icon) - 2px);
            flex-shrink: 0;
            display: block;
        }
        .bookmark-icon .fallback-text {
            font-size: 22px;
            font-weight: 900;
            line-height: 1;
            color: var(--text-sub);
        }
        .bookmark-item:active .bookmark-icon {
            box-shadow: var(--shadow-hover);
            transform: scale(0.92);
        }
        .bookmark-name {
            font-size: 12px;
            font-weight: 900;
            color: var(--text);
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 56px;
            opacity: 0.80;
            letter-spacing: 0.1px;
            transition: opacity 0.2s;
        }
        .hide-label .bookmark-name {
            opacity: 0;
            height: 0;
            overflow: hidden;
        }
        .context-menu {
            position: fixed;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.20);
            padding: 8px 0;
            min-width: 130px;
            z-index: 9999;
            opacity: 0;
            transform: scale(0.92);
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid var(--divider);
        }
        .context-menu.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        .context-menu .menu-item {
            display: block;
            width: 100%;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            border: none;
            background: transparent;
            text-align: left;
            transition: background 0.15s;
            border-radius: 0;
            letter-spacing: 0.2px;
        }
        .context-menu .menu-item:first-child {
            border-radius: 16px 16px 0 0;
        }
        .context-menu .menu-item:last-child {
            border-radius: 0 0 16px 16px;
        }
        .context-menu .menu-item:only-child {
            border-radius: 16px;
        }
        .context-menu .menu-item:active {
            background: var(--icon-bg);
        }
        .context-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9998;
            background: transparent;
            pointer-events: none;
        }
        .context-overlay.active {
            pointer-events: auto;
        }
        .hidden-item {
            display: none !important;
        }
        .add-btn-hidden {
            display: none !important;
        }
        /* 侧边面板遮罩 */
        .bg-panel-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.24s;
        }
        .bg-panel-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        /* 设置面板下移避开状态栏，无毛玻璃 */
        .bg-set-panel {
            position: fixed;
            top: var(--safe-area-top);
            right: -220px;
            width: min(200px, 75vw);
            height: 50vh;
            max-height: 520px;
            background: var(--card-bg);
            z-index: 101;
            padding: 16px 12px;
            overflow-y: auto;
            transition: right 0.3s cubic-bezier(0.34, 1, 0.64, 1);
            border-radius: 12px 0 0 12px;
        }
        .bg-set-panel.active {
            right: 0;
        }
        .panel-title {
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
        }
        .set-group {
            margin-bottom: 14px;
        }
        .set-label {
            font-size: 12px;
            margin-bottom: 6px;
            display: block;
            color: var(--text);
        }
        /* 彻底修复移动端color取色器兼容 */
        .color-input {
            width: 100%;
            height: 48px;
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid var(--divider);
            background: transparent;
            color: var(--text);
            font-size: 12px;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border-radius: 6px;
            border: none;
        }
        .opacity-input {
            width: 100%;
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid var(--divider);
            background: transparent;
            color: var(--text);
            font-size: 12px;
        }
        .file-input-wrap {
            display: flex;
            gap: 6px;
        }
        .file-btn {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--divider);
            background: transparent;
            color: var(--text);
            text-align: center;
            font-size: 12px;
        }
        .reset-btn {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            border-radius: 8px;
            background: #ff4757;
            color: #fff;
            border: none;
            font-size: 12px;
        }
        .toggle-btn-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            background: var(--icon-bg);
            border-radius: 8px;
        }
        .toggle-switch {
            width: 32px;
            height: 18px;
            border-radius: 99px;
            background: rgba(255,255,0.35);
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-switch.active {
            background: #3478f6;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 1px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            transition: left 0.2s;
        }
        .toggle-switch.active::after {
            left: 15px;
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="home-container">
        <div class="search-wrapper">
            <div class="search-row">
                <div class="search-bar">
                    <button type="button" id="searchBtn" class="btn-icon" aria-label="搜索">
                        <svg viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="8" />
                            <line x1="21" y1="21" x2="16.65" y2="16.65" />
                        </svg>
                    </button>
                    <input type="text" id="searchInput" placeholder="搜索或输入网址" autocomplete="off">
                    <button type="button" id="scanBtn" class="btn-icon" aria-label="扫一扫">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 7V5a2 2 0 0 1 2-2h2" />
                            <path d="M17 3h2a2 2 0 0 1 2 2v2" />
                            <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
                            <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
                            <line x1="7" y1="12" x2="17" y2="12" />
                        </svg>
                    </button>
                </div>
                <!-- 合并单一多功能按钮 -->
                <div class="combo-btn-wrap">
                    <button type="button" id="comboMainBtn" aria-label="标签/设置切换">
                        <!-- 优化居中标签图标，双层方块对齐 -->
                        <svg class="icon-tab" viewBox="0 0 24 24">
                            <rect x="3" y="3" width="14" height="14" rx="3" />
                            <rect x="7" y="7" width="14" height="14" rx="3" />
                        </svg>
                        <svg class="icon-set" viewBox="0 0 24 24">
                            <rect x="3" y="3" width="18" height="18" rx="4" />
                            <circle cx="12" cy="12" r="5" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <section class="home-section no-card" id="section-shortcuts">
            <div class="section-body" id="body-shortcuts">
                <div class="bookmarks" id="shortcuts-container"></div>
            </div>
        </div>
    </div>
    <!-- 侧边面板遮罩 -->
    <div class="bg-panel-overlay" id="bgPanelOverlay"></div>
    <!-- 右侧设置面板 -->
    <div class="bg-set-panel" id="bgSetPanel">
        <h3 class="panel-title">背景自定义设置</h3>
        <div class="set-group toggle-btn-wrap">
            <label class="set-label" style="margin-bottom:0;">显示快捷图标</label>
            <div class="toggle-switch" id="toggleBookmarks"></div>
        </div>
        <div class="set-group toggle-btn-wrap">
            <label class="set-label" style="margin-bottom:0;">显示添加按钮</label>
            <div class="toggle-switch" id="toggleAddBtn"></div>
        </div>
        <div class="set-group toggle-btn-wrap">
            <label class="set-label" style="margin-bottom:0;">隐藏图标文字</label>
            <div class="toggle-switch" id="toggleLabelHide"></div>
        </div>
        <div class="set-group">
            <label class="set-label">浅色模式背景色</label>
            <input type="color" class="color-input" id="lightBgColor">
        </div>
        <div class="set-group">
            <label class="set-label">深色模式背景色</label>
            <input type="color" class="color-input" id="darkBgColor">
        </div>
        <div class="set-group">
            <label class="set-label">浅色背景图</label>
            <div class="file-input-wrap">
                <button type="button" class="file-btn" id="uploadLightBgBtn">上传</button>
                <input type="file" id="lightBgFileInput" accept="image/*">
            </div>
        </div>
        <div class="set-group">
            <label class="set-label">深色背景图</label>
            <div class="file-input-wrap">
                <button type="button" class="file-btn" id="uploadDarkBgBtn">上传</button>
                <input type="file" id="darkBgFileInput" accept="image/*">
            </div>
        </div>
        <div class="set-group">
            <label class="set-label">背景透明度(0~100)</label>
            <input type="number" min="0" max="100" step="5" value="100" class="opacity-input" id="bgOpacityPercent">
        </div>
        <button type="button" class="reset-btn" id="resetBgBtn">重置全部设置</button>
    </div>
    <div class="context-overlay" id="contextOverlay"></div>
    <div class="context-menu" id="contextMenu">
        <button type="button" class="menu-item" data-action="edit">编辑</button>
        <button type="button" class="menu-item" data-action="top">置顶</button>
        <button type="button" class="menu-item" data-action="bottom">置底</button>
        <button type="button" class="menu-item" data-action="delete">删除</button>
    </div>
    <script>
        document.addEventListener('contextmenu', function(e) {
            if (e.target.closest('.bookmark-item')) e.preventDefault();
        });
        var contextTargetId = null;
        var _longPressFired = false;
        var _bookmarksVisible = true;
        var _addButtonVisible = true;
        var _hideLabel = false;
        var currentShortcuts = [];
        var dragItem = null;
        var container = document.getElementById('shortcuts-container');
        var contextMenu = document.getElementById('contextMenu');
        var contextOverlay = document.getElementById('contextOverlay');
        var addButtonElement = null;
        // 合并按钮与面板状态分离变量修复
        const comboBtn = document.getElementById('comboMainBtn');
        const bgPanel = document.getElementById('bgSetPanel');
        const bgOverlay = document.getElementById('bgPanelOverlay');
        let isPanelOpen = false;
        let showSetIcon = false;
        // 背景面板DOM
        const lightColorInput = document.getElementById('lightBgColor');
        const darkColorInput = document.getElementById('darkBgColor');
        const opacityPercentInput = document.getElementById('bgOpacityPercent');
        const uploadLightBgBtn = document.getElementById('uploadLightBgBtn');
        const lightBgFileInput = document.getElementById('lightBgFileInput');
        const uploadDarkBgBtn = document.getElementById('uploadDarkBgBtn');
        const darkBgFileInput = document.getElementById('darkBgFileInput');
        const resetBtn = document.getElementById('resetBgBtn');
        const toggleBookmarksSwitch = document.getElementById('toggleBookmarks');
        const toggleAddBtnSwitch = document.getElementById('toggleAddBtn');
        const toggleLabelHideSwitch = document.getElementById('toggleLabelHide');
        // 配置存储
        let bgConfig = {
            lightColor: '#f0f0f5',
            darkColor: '#000000',
            opacityPercent: 100,
            imageUrlLight: '',
            imageUrlDark: '',
            showBookmarks: true,
            showAddBtn: true,
            hideLabel: false
        };
        // 读取本地配置 + 手机取色器强制刷新修复
        function loadBgConfig() {
            try {
                const saved = localStorage.getItem('aira-bg-config');
                if (saved) bgConfig = JSON.parse(saved);
            } catch (e) {}
            // 双延时强制重绘，修复安卓iOS颜色赋值不生效
            setTimeout(() => {
                lightBgColor.value = bgConfig.lightColor;
                darkBgColor.value = bgConfig.darkColor;
            }, 30);
            setTimeout(() => {
                lightBgColor.value = bgConfig.lightColor;
                darkBgColor.value = bgConfig.darkColor;
            }, 120);
            opacityPercentInput.value = bgConfig.opacityPercent;
            toggleBookmarksSwitch.classList.toggle('active', bgConfig.showBookmarks);
            toggleAddBtnSwitch.classList.toggle('active', bgConfig.showAddBtn);
            toggleLabelHideSwitch.classList.toggle('active', bgConfig.hideLabel);
            _hideLabel = bgConfig.hideLabel;
            applyBookmarksVisible();
            applyAddButtonVisibility();
            applyLabelHide();
            applyBgStyle();
        }
        function saveBgConfig() {
            localStorage.setItem('aira-bg-config', JSON.stringify(bgConfig));
        }
        // 快捷图标显隐
        function applyBookmarksVisible() {
            const items = container.querySelectorAll('.bookmark-item[data-id]:not([data-id="add-button"])');
            items.forEach(el => el.classList.toggle('hidden-item', !bgConfig.showBookmarks));
        }
        function toggleBookmarksVisible() {
            bgConfig.showBookmarks = !bgConfig.showBookmarks;
            toggleBookmarksSwitch.classList.toggle('active', bgConfig.showBookmarks);
            applyBookmarksVisible();
            saveBgConfig();
        }
        // 添加按钮显隐
        function applyAddButtonVisibility() {
            if (!addButtonElement) return;
            addButtonElement.classList.toggle('add-btn-hidden', !bgConfig.showAddBtn);
        }
        function toggleAddBtnVisible() {
            bgConfig.showAddBtn = !bgConfig.showAddBtn;
            toggleAddBtnSwitch.classList.toggle('active', bgConfig.showAddBtn);
            applyAddButtonVisibility();
            saveBgConfig();
        }
        // 隐藏图标文字
        function applyLabelHide() {
            document.body.classList.toggle('hide-label', bgConfig.hideLabel);
        }
        function toggleLabelHide() {
            bgConfig.hideLabel = !bgConfig.hideLabel;
            _hideLabel = bgConfig.hideLabel;
            toggleLabelHideSwitch.classList.toggle('active', bgConfig.hideLabel);
            applyLabelHide();
            saveBgConfig();
        }
        // 应用背景样式
        function applyBgStyle() {
            const root = document.documentElement;
            const realOpacity = bgConfig.opacityPercent / 100;
            root.style.setProperty('--bg-color-light', bgConfig.lightColor);
            root.style.setProperty('--bg-color-dark', bgConfig.darkColor);
            root.style.setProperty('--bg-opacity', realOpacity);
            const isDark = root.classList.contains('aira-dark') || window.matchMedia('(prefers-color-scheme: dark)').matches;
            if(isDark){
                root.style.setProperty('--bg-image', bgConfig.imageUrlDark ? `url(${bgConfig.imageUrlDark})` : 'none');
                document.body.style.backgroundImage = bgConfig.imageUrlDark ? `url(${bgConfig.imageUrlDark})` : 'none';
                root.style.setProperty('--bg', bgConfig.darkColor);
            }else{
                root.style.setProperty('--bg-image', bgConfig.imageUrlLight ? `url(${bgConfig.imageUrlLight})` : 'none');
                document.body.style.backgroundImage = bgConfig.imageUrlLight ? `url(${bgConfig.imageUrlLight})` : 'none';
                root.style.setProperty('--bg', bgConfig.lightColor);
            }
        }
        // 统一关闭面板函数
        function closeAllPanels() {
            isPanelOpen = false;
            showSetIcon = false;
            bgPanel.classList.remove('active');
            bgOverlay.classList.remove('active');
            comboBtn.classList.remove('mode-set');
        }
        // 修复按钮点击逻辑
        function handleComboClick(e) {
            e.stopPropagation();
            if(isPanelOpen){
                closeAllPanels();
                return;
            }
            if(!showSetIcon){
                showSetIcon = true;
                comboBtn.classList.add('mode-set');
                if(window.AiraHome && AiraHome.openTabs) AiraHome.openTabs();
            }else{
                isPanelOpen = true;
                bgPanel.classList.add('active');
                bgOverlay.classList.add('active');
            }
        }
        // 遮罩点击关闭
        bgOverlay.addEventListener('click', function(e){
            e.stopPropagation();
            closeAllPanels();
        });
        // 面板内部点击不冒泡
        bgPanel.addEventListener('click', e => e.stopPropagation());
        // 重置全部背景
        function resetBg() {
            bgConfig = {
                lightColor: '#f0f0f5',
                darkColor: '#000000',
                opacityPercent: 100,
                imageUrlLight: '',
                imageUrlDark: '',
                showBookmarks: true,
                showAddBtn: true,
                hideLabel: false
            };
            lightBgColor.value = bgConfig.lightColor;
            darkBgColor.value = bgConfig.darkColor;
            opacityPercentInput.value = bgConfig.opacityPercent;
            toggleBookmarksSwitch.classList.add('active');
            toggleAddBtnSwitch.classList.add('active');
            toggleLabelHideSwitch.classList.remove('active');
            _hideLabel = false;
            applyBookmarksVisible();
            applyAddButtonVisibility();
            applyLabelHide();
            saveBgConfig();
            applyBgStyle();
        }
        // 上传背景图
        function handleLightBgUpload(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = e => {
                bgConfig.imageUrlLight = e.target.result;
                saveBgConfig();
                applyBgStyle();
            };
            reader.readAsDataURL(file);
        }
        function handleDarkBgUpload(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = e => {
                bgConfig.imageUrlDark = e.target.result;
                saveBgConfig();
                applyBgStyle();
            };
            reader.readAsDataURL(file);
        }
        // 颜色修改双重监听，修复移动端点击赋值失效
        function bindBgEvents() {
            comboBtn.addEventListener('click', handleComboClick);
            // 开关
            toggleBookmarksSwitch.addEventListener('click', toggleBookmarksVisible);
            toggleAddBtnSwitch.addEventListener('click', toggleAddBtnSwitch);
            toggleLabelHideSwitch.addEventListener('click', toggleLabelHide);
            // 浅色背景色
            function updateLight() {
                bgConfig.lightColor = lightBgColor.value;
                saveBgConfig();
                applyBgStyle();
            }
            lightBgColor.addEventListener('input', updateLight);
            lightBgColor.addEventListener('change', updateLight);
            lightBgColor.addEventListener('click', ()=>{
                setTimeout(()=>{lightBgColor.value = bgConfig.lightColor},20);
            });
            // 深色背景色
            function updateDark() {
                bgConfig.darkColor = darkBgColor.value;
                saveBgConfig();
                applyBgStyle();
            }
            darkBgColor.addEventListener('input', updateDark);
            darkBgColor.addEventListener('change', updateDark);
            darkBgColor.addEventListener('click', ()=>{
                setTimeout(()=>{darkBgColor.value = bgConfig.darkColor},20);
            });
            // 透明度
            opacityPercentInput.addEventListener('input', e => {
                let val = parseInt(e.target.value);
                if (isNaN(val)) val = 100;
                if (val < 0) val = 0;
                if (val > 100) val = 100;
                bgConfig.opacityPercent = val;
                saveBgConfig();
                applyBgStyle();
            });
            // 上传按钮
            uploadLightBgBtn.addEventListener('click', () => lightBgFileInput.click());
            lightBgFileInput.addEventListener('change', e => {
                if (e.target.files[0]) handleLightBgUpload(e.target.files[0]);
            });
            uploadDarkBgBtn.addEventListener('click', () => darkBgFileInput.click());
            darkBgFileInput.addEventListener('change', e => {
                if (e.target.files[0]) handleDarkBgUpload(e.target.files[0]);
            });
            resetBtn.addEventListener('click', resetBg);
            // 系统深色切换监听
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{
                applyBgStyle();
            })
        }
        function loadBookmarkVisibility() {
            try {
                const saved = localStorage.getItem('aira-bg-config');
                if (saved) bgConfig = JSON.parse(saved);
            } catch (_) {}
        }
        function loadAddButtonVisibility() {
            try {
                const saved = localStorage.getItem('aira-bg-config');
                if (saved) bgConfig = JSON.parse(saved);
            } catch (_) {}
        }
        function applyStagger(body) {
            if (!body) return;
            const key = body.id;
            if (window._staggerTimers && window._staggerTimers[key]) clearTimeout(window._staggerTimers[key]);
            const items = body.querySelectorAll('.bookmark-item');
            if (items.length === 0) return;
            body.classList.remove('expanding');
            void body.offsetWidth;
            body.classList.add('expanding');
            for (let i = 0; i < items.length; i++) items[i].style.animationDelay = `${i * 40}ms`;
            const maxMs = items.length * 40 + 500;
            if (!window._staggerTimers) window._staggerTimers = {};
            window._staggerTimers[key] = setTimeout(() => {
                body.classList.remove('expanding');
                for (let j = 0; j < items.length; j++) items[j].style.animationDelay = '';
                window._staggerTimers[key] = null;
            }, maxMs);
        }
        function applyTheme(theme) {
            if (!theme) return;
            const root = document.documentElement;
            const effective = theme.effectiveMode || 'light';
            if (effective === 'dark') {
                root.classList.add('aira-dark');
            } else {
                root.classList.remove('aira-dark');
            }
            applyBgStyle();
        }
        function applyPrivacyMode() {}
        function showContextMenu(x, y, id) {
            contextTargetId = id;
            const targetItem = currentShortcuts.find(item => item.id === id);
            const isSystem = targetItem && targetItem.kind === 'system';
            const editBtn = contextMenu.querySelector('.menu-item[data-action="edit"]');
            if (editBtn) editBtn.style.display = isSystem ? 'none' : 'block';
            contextMenu.style.left = `${x}px`;
            contextMenu.style.top = `${y}px`;
            contextMenu.classList.add('active');
            contextOverlay.classList.add('active');
        }
        function hideContextMenu() {
            contextTargetId = null;
            contextMenu.classList.remove('active');
            contextOverlay.classList.remove('active');
        }
        contextOverlay.addEventListener('click', hideContextMenu);
        contextOverlay.addEventListener('touchstart', hideContextMenu, { passive: true });
        contextMenu.addEventListener('click', e => {
            const target = e.target.closest('.menu-item');
            if (!target) return;
            const action = target.dataset.action;
            const id = contextTargetId;
            if (!id || !window.AiraHome) { hideContextMenu(); return; }
            switch (action) {
                case 'edit': AiraHome.editShortcut(id); break;
                case 'delete': AiraHome.confirmDeleteShortcut(id); break;
                case 'top': AiraHome.moveShortcutToTop(id); break;
                case 'bottom': AiraHome.moveShortcut(id); break;
            }
            hideContextMenu();
        });
        contextMenu.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
        function setupLongPress(element, onLongPress, onClick) {
            let timer = null, startX, startY, fired = false;
            function start(e) {
                e.preventDefault();
                const touch = e.touches ? e.touches[0] : e;
                startX = touch.clientX; startY = touch.clientY; fired = false;
                timer = setTimeout(() => { fired = true; onLongPress(e); }, 500);
            }
            function move(e) {
                if (!timer) return;
                const touch = e.touches ? e.touches[0] : e;
                const dx = touch.clientX - startX, dy = touch.clientY - startY;
                if (Math.abs(dx) > 10 || Math.abs(dy) > 10) { clearTimeout(timer); timer = null; }
            }
            function end(e) {
                clearTimeout(timer); timer = null;
                if (fired) {
                    e.preventDefault();
                    _longPressFired = true;
                    setTimeout(() => _longPressFired = false, 100);
                } else if (onClick) onClick(e);
            }
            element.addEventListener('touchstart', start, { passive: false });
            element.addEventListener('touchmove', move, { passive: true });
            element.addEventListener('touchend', end, { passive: false });
            element.addEventListener('touchcancel', end, { passive: false });
            element.addEventListener('mousedown', e => { if (e.button === 0) start(e); });
            element.addEventListener('mousemove', move);
            element.addEventListener('mouseup', end);
            element.addEventListener('mouseleave', () => { clearTimeout(timer); timer = null; });
            element.addEventListener('contextmenu', e => e.preventDefault());
        }
        // 修复添加按钮SVG乱码
        function createAddButton() {
            const div = document.createElement('div');
            div.className = 'bookmark-item';
            div.dataset.id = 'add-button';
            const icon = document.createElement('div');
            icon.className = 'bookmark-icon';
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', '24');
            svg.setAttribute('height', '24');
            svg.setAttribute('viewBox', '0 0 24 24');
            svg.setAttribute('fill', 'none');
            svg.setAttribute('stroke', 'currentColor');
            svg.setAttribute('stroke-width', '2.8');
            svg.setAttribute('stroke-linecap', 'round');
            svg.setAttribute('stroke-linejoin', 'round');
            const lineH = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            lineH.setAttribute('x1', '5');
            lineH.setAttribute('y1', '12');
            lineH.setAttribute('x2', '19');
            lineH.setAttribute('y2', '12');
            const lineV = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            lineV.setAttribute('x1', '12');
            lineV.setAttribute('y1', '5');
            lineV.setAttribute('x2', '12');
            lineV.setAttribute('y2', '19');
            svg.appendChild(lineH);
            svg.appendChild(lineV);
            icon.appendChild(svg);
            const name = document.createElement('span');
            name.className = 'bookmark-name';
            name.textContent = '添加';
            div.appendChild(icon);
            div.appendChild(name);
            setupLongPress(div, () => {}, e => {
                if (_longPressFired) { _longPressFired = false; return; }
                if (window.AiraHome && typeof AiraHome.openShortcutPicker === 'function') AiraHome.openShortcutPicker();
            });
            return div;
        }
        // 拖拽排序
        function initDragSort() {
            container.addEventListener('dragstart', e=>{
                const item = e.target.closest('.bookmark-item[data-id]:not([data-id="add-button"])');
                if(!item) return e.preventDefault();
                dragItem = item;
                item.style.opacity = '0.4';
                e.dataTransfer.effectAllowed = 'move';
            })
            container.addEventListener('dragend',e=>{
                if(!dragItem) return;
                dragItem.style.opacity = '1';
                container.querySelectorAll('.bookmark-item').forEach(i=>i.classList.remove('drag-over'));
                dragItem = null;
            })
            container.addEventListener('dragover',e=>{
                e.preventDefault();
                const target = e.target.closest('.bookmark-item[data-id]:not([data-id="add-button"])');
                if(!target || target === dragItem) return;
                container.querySelectorAll('.bookmark-item').forEach(i=>i.classList.remove('drag-over'));
                target.classList.add('drag-over');
            })
            container.addEventListener('drop',e=>{
                e.preventDefault();
                const target = e.target.closest('.bookmark-item[data-id]:not([data-id="add-button"])');
                if(!target || !dragItem || target === dragItem) return;
                const dragId = dragItem.dataset.id;
                const targetId = target.dataset.id;
                const dragIdx = currentShortcuts.findIndex(s=>s.id === dragId);
                const targetIdx = currentShortcuts.findIndex(s=>s.id === targetId);
                if(dragIdx === -1 || targetIdx === -1) return;
                const temp = currentShortcuts[dragIdx];
                currentShortcuts.splice(dragIdx,1);
                currentShortcuts.splice(targetIdx,0,temp);
                if(window.AiraHome && AiraHome.saveShortcuts){
                    AiraHome.saveShortcuts(currentShortcuts);
                }
                renderShortcuts(currentShortcuts);
            })
        }
        function renderShortcuts(items) {
            currentShortcuts = items || [];
            container.innerHTML = '';
            if (items) for (let i = 0; i < items.length; i++) container.appendChild(createShortcutItem(items[i]));
            addButtonElement = createAddButton();
            container.appendChild(addButtonElement);
            applyBookmarksVisible();
            applyAddButtonVisibility();
            applyStagger(document.getElementById('body-shortcuts'));
        }
        function createShortcutItem(item) {
            const div = document.createElement('div');
            div.className = 'bookmark-item';
            div.dataset.id = item.id;
            div.draggable = true;
            const icon = document.createElement('div');
            icon.className = 'bookmark-icon';
            const iconUrl = item.icon || null;
            if (iconUrl) {
                const img = document.createElement('img');
                img.src = iconUrl; img.alt = item.title || '图标';
                img.style.width = '36px';
                img.style.height = '36px';
                img.style.objectFit = 'contain';
                img.onerror = () => {
                    if (img.parentNode) img.parentNode.removeChild(img);
                    const fallback = document.createElement('span');
                    fallback.className = 'fallback-text';
                    fallback.textContent = (item.title || '?').charAt(0);
                    icon.appendChild(fallback);
                };
                icon.appendChild(img);
            } else {
                const fallback = document.createElement('span');
                fallback.className = 'fallback-text';
                fallback.textContent = (item.title || '?').charAt(0);
                icon.appendChild(fallback);
            }
            const name = document.createElement('span');
            name.className = 'bookmark-name';
            name.textContent = item.title || item.url || '未命名';
            div.appendChild(icon);
            div.appendChild(name);
            setupLongPress(div, e => {
                const touch = e.touches ? e.touches[0] : e;
                let x = touch.clientX - 60, y = touch.clientY - 20;
                if (x < 10) x = 10;
                if (x + 150 > window.innerWidth) x = window.innerWidth - 150;
                if (y < 20) y = 20;
                if (y + 200 > window.innerHeight) y = window.innerHeight - 200;
                showContextMenu(x, y, item.id);
            }, e => {
                if (_longPressFired) { _longPressFired = false; return; }
                if (window.AiraHome && item.id) AiraHome.openShortcut(item.id);
            });
            return div;
        }
        function doSearch() {
            const input = document.getElementById('searchInput');
            const query = input.value.trim();
            if (!query) return;
            if (window.AiraHome) AiraHome.search(query);
        }
        function setupGlobalBlankArea() {
            let timer = null, startX, startY, fired = false, allowShortTap = false;
            function isInteractive(target) {
                if (!target) return false;
                return target.closest('.bookmark-item') || target.closest('.btn-icon') ||
                    target.closest('#comboMainBtn') || target.closest('#searchInput') ||
                    target.closest('.context-menu') || target.closest('.search-bar') ||
                    target.closest('.bg-set-panel');
            }
            function shouldRespond(x, y) {
                const target = document.elementFromPoint(x, y);
                return !isInteractive(target);
            }
            function touchStart(e) {
                const touch = e.touches[0];
                allowShortTap = shouldRespond(touch.clientX, touch.clientY);
                if (!allowShortTap) return;
                startX = touch.clientX; startY = touch.clientY; fired = false;
                timer = setTimeout(() => { fired = true; toggleBookmarksVisible(); }, 500);
            }
            function touchMove(e) {
                if (!timer) return;
                const touch = e.touches[0];
                const dx = touch.clientX - startX, dy = touch.clientY - startY;
                if (Math.abs(dx) > 10 || Math.abs(dy) > 10) { clearTimeout(timer); timer = null; allowShortTap = false; }
            }
            function touchEnd() {
                if (timer) {
                    clearTimeout(timer);
                    if (!fired && allowShortTap) toggleAddBtnVisible();
                }
                fired = false; allowShortTap = false;
            }
            document.addEventListener('touchstart', touchStart, { passive: true });
            document.addEventListener('touchmove', touchMove, { passive: true });
            document.addEventListener('touchend', touchEnd, { passive: true });
            document.addEventListener('touchcancel', touchEnd, { passive: true });
            function mouseDown(e) {
                if (e.button !== 0) return;
                allowShortTap = shouldRespond(e.clientX, e.clientY);
                if (!allowShortTap) return;
                startX = e.clientX; startY = e.clientY; fired = false;
                timer = setTimeout(() => { fired = true; toggleBookmarksVisible(); }, 500);
            }
            function mouseMove(e) {
                if (!timer) return;
                const dx = e.clientX - startX, dy = e.clientY;
                if (Math.abs(dx) > 10 || Math.abs(dy) > 10) { clearTimeout(timer); timer = null; allowShortTap = false; }
            }
            function mouseUp() {
                if (timer) {
                    clearTimeout(timer);
                    if (!fired && allowShortTap) toggleAddBtnVisible();
                }
                fired = false; allowShortTap = false;
            }
            document.addEventListener('mousedown', mouseDown);
            document.addEventListener('mousemove', mouseMove);
            document.addEventListener('mouseup', mouseUp);
            document.addEventListener('mouseleave', () => { if (timer) { clearTimeout(timer); timer = null; } fired = false; });
        }
        function init() {
            loadBgConfig();
            bindBgEvents();
            initDragSort();
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.value = '';
            loadBookmarkVisibility();
            loadAddButtonVisibility();
            setupGlobalBlankArea();
            if (!window.AiraHome) { renderShortcuts([]); return; }
            AiraHome.getShortcuts().then(items => renderShortcuts(items)).catch(() => renderShortcuts([]));
            AiraHome.getTheme().then(applyTheme).catch(() => {});
            if (typeof AiraHome.getPrivacyMode === 'function') AiraHome.getPrivacyMode().then(applyPrivacyMode).catch(() => {});
        }
        window.addEventListener('aira-home-shortcuts-changed', e => renderShortcuts(e.detail || []));
        window.addEventListener('aira-home-theme-changed', e => applyTheme(e.detail || {}));
        window.addEventListener('aira-home-privacy-mode-changed', e => applyPrivacyMode(e.detail || {}));
        document.getElementById('searchBtn').addEventListener('click', doSearch);
        document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
        document.getElementById('scanBtn').addEventListener('click', () => { if (window.AiraHome && AiraHome.scanQr) AiraHome.scanQr(); });
        document.getElementById('comboMainBtn').addEventListener('click', handleComboClick);
        document.addEventListener('click', e => {
            if (contextMenu.classList.contains('active') && !contextMenu.contains(e.target)) hideContextMenu();
        });
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    </script>
</body>
</html>
